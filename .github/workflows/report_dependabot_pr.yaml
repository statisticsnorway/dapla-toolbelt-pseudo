name: Report Dependabot pull request

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    uses: statisticsnorway/dapla-stat-system/.github/workflows/report_dependabot_pr.yaml@main
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
